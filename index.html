<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>US Flood Disaster 3D Explorer</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
    <!-- Embedded copy of flood_timeseries_aggregated.json. Same NOAA NCEI +
         FEMA NRI data, loaded via a classic script tag so the scene renders
         even under file:// (where fetch is CORS-blocked). Regenerate with
         scripts/embed_flood_data.py after rebuilding the JSON. -->
    <script src="flood_data_embedded.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
        }

        .hud-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px 20px;
            color: #1a1d21;
            z-index: 10;
            min-width: 240px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.12);
        }

        .hud-title {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 26px;
            font-weight: 700;
            color: #0a2d8c;
            font-family: monospace;
            margin: 4px 0;
        }

        .hud-sub {
            font-size: 12px;
            color: #4b5563;
        }

        #hud-source {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 10px;
            letter-spacing: 0.5px;
            color: #6b7280;
            font-family: monospace;
        }

        #map-notice {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 520px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 60, 70, 0.45);
            border-radius: 8px;
            padding: 18px 22px;
            color: #8a2b33;
            font-size: 13px;
            line-height: 1.5;
            z-index: 20;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        }

        .notice-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .notice-row input {
            flex: 1;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            padding: 7px 10px;
            color: #1a1d21;
            font-family: monospace;
            font-size: 11px;
        }

        .notice-row button {
            background: #c83c46;
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        #detail-card {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 300px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(10, 45, 140, 0.25);
            border-radius: 8px;
            padding: 20px;
            color: #1a1d21;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
            display: none;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #10131a;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .card-row span:last-child {
            color: #10131a;
            font-weight: 500;
            font-family: monospace;
            text-align: right;
        }

        .btn-reset {
            margin-top: 12px;
            width: 100%;
            background: rgba(10, 45, 140, 0.06);
            color: #0a2d8c;
            border: 1px solid #0a2d8c;
            border-radius: 4px;
            padding: 8px 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #0a2d8c;
            color: #fff;
        }

        .legend-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 250px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 14px 16px;
            color: #1a1d21;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        }

        .legend-title {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            font-size: 12px;
            color: #1a1d21;
        }

        .legend-row .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex: 0 0 auto;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .swatch-blue {
            background: rgb(20, 110, 245);
        }

        .swatch-flash {
            background: rgb(235, 30, 45);
        }

        .swatch-glow {
            background: radial-gradient(circle, rgba(255, 236, 180, 0.95) 0%, rgba(226, 135, 25, 0.95) 100%);
            border-radius: 50%;
        }

        .timeline-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            color: #1a1d21;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.12);
        }

        .timeline-container button {
            background: #0a2d8c;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .timeline-container input[type=range] {
            width: 280px;
            accent-color: #0a2d8c;
            cursor: pointer;
        }

        .year-display {
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: #0a2d8c;
            min-width: 138px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="map-notice"></div>

    <div class="hud-panel">
        <div class="hud-title">US Cumulative Flood Loss</div>
        <div class="hud-value" id="hud-total-loss">$0</div>
        <div class="hud-sub" id="hud-event-count">Loading dataset...</div>
        <div id="hud-source">SOURCE: NOAA NCEI &amp; FEMA NRI</div>
    </div>

    <div id="detail-card">
        <div class="card-title" id="card-location">Location</div>
        <div class="card-row"><span>Type:</span><span id="card-type">&mdash;</span></div>
        <div class="card-row"><span id="card-damage-label">Property Damage:</span><span id="card-damage">$0</span></div>
        <div class="card-row"><span>Events:</span><span id="card-events">&mdash;</span></div>
        <button class="btn-reset" onclick="resetView()">Reset Overview</button>
    </div>

    <div class="legend-panel">
        <div class="legend-title">Legend</div>
        <div class="legend-row"><span class="swatch swatch-blue"></span><span>Regular Flood</span></div>
        <div class="legend-row"><span class="swatch swatch-flash"></span><span>Flash Flood</span></div>
        <div class="legend-row"><span class="swatch swatch-glow"></span><span>Property Loss Intensity</span></div>
    </div>

    <div class="timeline-container">
        <button id="play-btn" onclick="togglePlay()">▶</button>
        <input type="range" id="year-slider" min="1999" max="2025" value="1999" step="1"
            oninput="onYearChange(this.value)">
        <span class="year-display" id="year-label">Year 1999</span>
    </div>

    <script>
        // Bundled demo token. Override it with ?token=pk... or a saved value —
        // the public demo token is commonly rate-limited or rejected, and an
        // invalid token 401s the style request (the basemap then never loads).
        (function resolveMapboxToken() {
            const fromUrl = new URLSearchParams(location.search).get('token');
            let saved = null;
            try { saved = localStorage.getItem('mapbox_token'); } catch (e) { /* private mode */ }
            mapboxgl.accessToken = fromUrl || saved ||
                'pk.eyJ1IjoiZXJpY2x1MCIsImEiOiJjbXVpczlsMTYxZGNvMnlzNXQ1dHphaXpzIn0.naZH9-F_oQd_YiekyT372A';
        })();

        const US_BOUNDS = [[-130.0, 22.0], [-65.0, 52.0]];
        const DEFAULT_VIEW = { center: [-98.58, 39.83], zoom: 3.8, pitch: 50, bearing: 0 };
        const FOCUS_VIEW = { zoom: 6.8, pitch: 62 };
        const YEAR_MIN = 1999;
        const YEAR_MAX = 2025;
        const YEARS = [];
        for (let y = YEAR_MIN; y <= YEAR_MAX; y++) YEARS.push(y);
        const TOTAL_YEARS = YEARS.length; // 27
        const PLAY_STEP_MS = 1500;
        const COLUMN_RADIUS = 8800;
        const ELEVATION_SCALE = 30000;
        const EASE_IN_OUT = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const DUAL_TYPE_OFFSET = 0.1;

        // Camera is fully locked: only column clicks (flyTo) and the
        // "Reset Overview" button are allowed to move it programmatically.
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: DEFAULT_VIEW.center,
            zoom: DEFAULT_VIEW.zoom,
            pitch: DEFAULT_VIEW.pitch,
            bearing: DEFAULT_VIEW.bearing,
            projection: 'globe',
            maxBounds: US_BOUNDS,
            minZoom: 3.2,
            maxZoom: 12,
            dragPan: false,
            scrollZoom: false,
            boxZoom: false,
            dragRotate: false,
            clickZoom: false,
            doubleClickZoom: false,
            keyboard: false,
            touchZoomRotate: false,
            touchPitch: false,
            pitchWithRotate: false
        });

        // Embedded copy of the aggregated dataset (flood_data_embedded.js).
        // It is the same NOAA NCEI + FEMA NRI data as the external JSON and
        // renders immediately, so the scene works even when the fetch below
        // cannot run (file:// CORS, offline, 404).
        const EMBEDDED_TIME_SERIES = (typeof window !== 'undefined' && window.__FLOOD_DATA__) || null;

        let timeSeriesData = {};
        let universe = null;
        let yearEntries = null;
        let yearLoss = null;
        let cumByYear = null;
        let universeById = null;
        let rootIndex = null;
        let currentYear = 0;
        let isPlaying = false;
        let playInterval = null;
        let deckOverlay = null;

        // --- helpers -------------------------------------------------------

        // The basemap needs a valid Mapbox token. Override the bundled one with
        // ?token=pk... or a previously saved value; otherwise the style request
        // 401s and the basemap never loads.
        function showMapNotice(message, actionable) {
            const el = document.getElementById('map-notice');
            el.innerHTML = '';
            const text = document.createElement('div');
            text.textContent = message;
            el.appendChild(text);

            if (actionable) {
                const row = document.createElement('div');
                row.className = 'notice-row';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'pk.eyJ... Mapbox public token';
                input.id = 'token-input';
                const btn = document.createElement('button');
                btn.textContent = 'Apply';
                btn.onclick = () => {
                    const value = input.value.trim();
                    if (!value) return;
                    try { localStorage.setItem('mapbox_token', value); } catch (e) { /* private mode */ }
                    location.reload();
                };
                row.appendChild(input);
                row.appendChild(btn);
                el.appendChild(row);
            }

            el.style.display = 'block';
        }

        function hideMapNotice() {
            document.getElementById('map-notice').style.display = 'none';
        }

        function formatUSD(value) {
            const v = Number(value) || 0;
            if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
            if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
            if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
            return '$' + v;
        }

        function formatCurrency(value) {
            return '$' + Math.round(Number(value) || 0).toLocaleString('en-US');
        }

        function setSourceLabel(text) {
            document.getElementById('hud-source').innerText = 'SOURCE: ' + text;
        }

        function isValidDataset(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
            return Object.keys(data).some(k => /^\d{4}-\d{2}$/.test(k) &&
                data[k] && Array.isArray(data[k].events) && data[k].events.length > 0);
        }

        // Binary scheme: translucent tech blue for regular inland floods,
        // warning red for flash floods. No damage tiers — every spike shares
        // one of exactly two colors.
        const FLOOD_REGULAR_COLOR = [20, 110, 245, 230];
        const FLOOD_FLASH_COLOR = [235, 30, 45, 240];

        function colorForEvent(e) {
            return Number(e.t) === 1 ? FLOOD_FLASH_COLOR : FLOOD_REGULAR_COLOR;
        }

        function elevationForDamage(d) {
            return Math.pow(Math.log10(Number(d) + 1), 1.4) * ELEVATION_SCALE;
        }

        // Yearly aggregation: within each year, merge every event by
        // geographic grid + event type, summing raw and CPI-adjusted damage
        // and counting occurrences. Also keeps per-year cumulative loss.
        function buildYearData() {
            if (yearEntries) return;
            yearEntries = [];
            yearLoss = [];
            cumByYear = [];
            let running = 0;
            for (let y = 0; y < TOTAL_YEARS; y++) {
                const merged = new Map();
                let loss = 0;
                for (let m = 0; m < 12; m++) {
                    const key = YEARS[y] + '-' + String(m + 1).padStart(2, '0');
                    const entry = timeSeriesData[key];
                    if (!entry) continue;
                    loss += Number(entry.month_loss) || 0;
                    (entry.events || []).forEach(e => {
                        if (!Array.isArray(e.c) || e.c.length < 2) return;
                        const d = Number(e.d) || 0;
                        const dc = Number(e.dc) || 0;
                        if (d <= 0) return;
                        const t = Number(e.t) === 1 ? 1 : 0;
                        const ck = e.c[0] + ',' + e.c[1];
                        const id = ck + '|' + (t === 1 ? 'flash' : 'regular');
                        const prev = merged.get(id);
                        if (prev) {
                            prev.d += d;
                            prev.dc += dc;
                            prev.freq += 1;
                        } else {
                            merged.set(id, { id, c: e.c.slice(), d, dc, freq: 1, n: e.n, t });
                        }
                    });
                }
                yearEntries[y] = merged;
                yearLoss[y] = loss;
                running += loss;
                cumByYear[y] = running;
            }
        }

        // Fixed, sorted universe of every (grid, event-type) pair that ever
        // recorded loss. Rows never leave the array, so deck.gl tweens
        // elevation/color by index instead of remapping. Grids hosting both
        // flood types in some year get the flash column nudged a hair so the
        // two cylinders never z-fight.
        function buildUniverse() {
            if (universe) return universe;
            const byKey = new Map();
            yearEntries.forEach(m => {
                m.forEach(v => {
                    if (!byKey.has(v.id)) {
                        byKey.set(v.id, { id: v.id, c: v.c.slice(), ck: v.c[0] + ',' + v.c[1], n: v.n, t: v.t });
                    }
                });
            });
            const groups = new Map();
            byKey.forEach(v => {
                const g = groups.get(v.ck) || [];
                g.push(v);
                groups.set(v.ck, g);
            });
            groups.forEach(g => {
                if (g.length > 1) {
                    const flash = g.find(v => v.t === 1);
                    if (flash) flash.c[0] += DUAL_TYPE_OFFSET;
                }
            });
            universe = Array.from(byKey.values()).sort((a, b) => (a.c[0] - b.c[0]) || (a.c[1] - b.c[1]));
            universeById = new Map();
            rootIndex = new Array(universe.length);
            universe.forEach((u, i) => {
                if (!universeById.has(u.ck)) universeById.set(u.ck, i);
            });
            for (let i = 0; i < universe.length; i++) rootIndex[i] = universeById.get(universe[i].ck);
            return universe;
        }

        // deck.gl v9 update pattern (the one the previously working build
        // used): each year tick creates fresh layer instances with the same
        // ids and pushes them through deckOverlay.setProps. Deck diffs by id,
        // reuses GPU buffers and tweens attributes in place. NOTE:
        // Layer.setProps() no longer exists in deck.gl v9 — never call it.
        const GLOW_COLOR_LOW = [255, 220, 80, 110];
        const GLOW_COLOR_HIGH = [230, 150, 10, 180];
        const GLOW_RADIUS_MIN = 45000;
        const GLOW_RADIUS_MAX = 60000;
        const GLOW_LOG_MAX = 10; // ~$10B CPI-adjusted loss in a single cell

        function glowScale(dc) {
            return Math.min(1, Math.max(0, Math.log10(Number(dc) + 1) / GLOW_LOG_MAX));
        }

        function glowRadiusFor(dc) {
            return GLOW_RADIUS_MIN + glowScale(dc) * (GLOW_RADIUS_MAX - GLOW_RADIUS_MIN);
        }

        function glowColorFor(dc) {
            const t = glowScale(dc);
            return [
                Math.round(GLOW_COLOR_LOW[0] + (GLOW_COLOR_HIGH[0] - GLOW_COLOR_LOW[0]) * t),
                Math.round(GLOW_COLOR_LOW[1] + (GLOW_COLOR_HIGH[1] - GLOW_COLOR_LOW[1]) * t),
                Math.round(GLOW_COLOR_LOW[2] + (GLOW_COLOR_HIGH[2] - GLOW_COLOR_LOW[2]) * t),
                Math.round(GLOW_COLOR_LOW[3] + (GLOW_COLOR_HIGH[3] - GLOW_COLOR_LOW[3]) * t)
            ];
        }

        // Yellow CPI-adjusted loss halo (ScatterplotLayer, under the columns).
        // One soft flat circle per grid cell; radius 45-60 km and color grow
        // with log10(CPI loss). Rows follow the stable universe order so deck
        // tweens radius/color smoothly from year to year.
        function buildGlowRows(yMap) {
            const byGrid = new Map();
            yMap.forEach(v => {
                const ck = v.c[0] + ',' + v.c[1];
                byGrid.set(ck, (byGrid.get(ck) || 0) + (Number(v.dc) || 0));
            });
            return buildUniverse()
                .filter((u, i) => rootIndex[i] === i)
                .map(u => ({ c: u.c, dc: byGrid.get(u.ck) || 0 }));
        }

        function updateLayer() {
            // Data must be aggregated and the overlay attached before the
            // first paint — never draw with a half-ready dataset.
            if (!deckOverlay || !yearEntries || !yearLoss) {
                console.warn('[flood] updateLayer skipped: dataset not ready yet');
                return;
            }

            const yMap = yearEntries[currentYear] || new Map();

            const rows = buildUniverse().map(u => {
                const v = yMap.get(u.id);
                return {
                    id: u.id,
                    c: u.c,
                    d: v ? v.d : 0,
                    freq: v ? v.freq : 0,
                    n: v ? v.n : u.n,
                    t: v ? v.t : u.t
                };
            });

            // Density thinning: drop the weakest ~30% of this year's clusters
            // (by total damage) so the column forest keeps only its core.
            const activeIdx = [];
            for (let i = 0; i < rows.length; i++) if (rows[i].d > 0) activeIdx.push(i);
            activeIdx.sort((a, b) => rows[a].d - rows[b].d);
            const cut = Math.floor(activeIdx.length * 0.3);
            for (let k = 0; k < cut; k++) rows[activeIdx[k]].d = 0;
            const activeCount = activeIdx.length - cut;

            document.getElementById('hud-total-loss').innerText = formatUSD(cumByYear[currentYear]);
            document.getElementById('hud-event-count').innerText =
                'Annual Loss in ' + YEARS[currentYear] + ': ' + formatUSD(yearLoss[currentYear]) +
                ' | ' + activeCount + ' Active Impact Cluster' + (activeCount === 1 ? '' : 's');
            document.getElementById('year-label').innerText = 'Year ' + YEARS[currentYear];

            try {
                const glowLayer = new deck.ScatterplotLayer({
                    id: 'cpi-loss-glow',
                    data: buildGlowRows(yMap),
                    getPosition: d => d.c,
                    getRadius: d => d.dc > 0 ? glowRadiusFor(d.dc) : 0,
                    getFillColor: d => d.dc > 0 ? glowColorFor(d.dc) : [0, 0, 0, 0],
                    radiusUnits: 'meters',
                    billboard: false,
                    pickable: false,
                    transitions: {
                        getRadius: { duration: 1200, easing: EASE_IN_OUT },
                        getFillColor: { duration: 1200, easing: EASE_IN_OUT }
                    }
                });

                const columnLayer = new deck.ColumnLayer({
                    id: 'flood-spikes',
                    data: rows,
                    getPosition: d => d.c,
                    getElevation: d => d.d > 0 ? elevationForDamage(d.d) : 0,
                    radius: COLUMN_RADIUS,
                    getFillColor: d => d.d > 0 ? colorForEvent(d) : [0, 0, 0, 0],
                    pickable: true,
                    autoHighlight: true,
                    highlightColor: [255, 255, 255, 255],
                    transitions: {
                        getElevation: { duration: 1200, easing: EASE_IN_OUT },
                        getFillColor: { duration: 1200 }
                    },
                    onClick: (info) => {
                        if (info.object && Number(info.object.d) > 0) focusOnSpike(info.object);
                    }
                });

                // Glow halo first, columns on top.
                deckOverlay.setProps({ layers: [glowLayer, columnLayer] });

                // A broken style stops mapbox-gl's render loop, which would
                // otherwise leave the overlay frozen on its first frame.
                if (map.triggerRepaint) map.triggerRepaint();
            } catch (err) {
                console.error('[flood] layer update failed for ' + YEARS[currentYear] + ':', err);
            }
        }

        // Re-aggregate from a fresh dataset (embedded copy or fetched JSON).
        // Every derived cache is reset first so a swap never mixes years.
        function applyDataset(data, origin) {
            if (!isValidDataset(data)) {
                console.warn('[flood] applyDataset: invalid or empty dataset from ' + origin);
                return false;
            }
            timeSeriesData = data;
            yearEntries = null;
            yearLoss = null;
            cumByYear = null;
            universe = null;
            universeById = null;
            rootIndex = null;
            buildYearData();
            buildUniverse();
            setSourceLabel('NOAA NCEI & FEMA NRI');
            updateLayer();
            console.info('[flood] dataset ready from ' + origin + ' (' +
                Object.keys(data).length + ' months)');
            return true;
        }

        function onYearChange(val) {
            currentYear = Math.min(TOTAL_YEARS - 1, Math.max(0, Math.round(parseFloat(val)) - YEAR_MIN));
            updateLayer();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                btn.innerText = '❚❚';
                playInterval = setInterval(() => {
                    currentYear = currentYear >= TOTAL_YEARS - 1 ? 0 : currentYear + 1;
                    document.getElementById('year-slider').value = YEARS[currentYear];
                    updateLayer();
                }, PLAY_STEP_MS);
            } else {
                btn.innerText = '▶';
                clearInterval(playInterval);
            }
        }

        function focusOnSpike(obj) {
            map.flyTo({
                center: obj.c,
                zoom: FOCUS_VIEW.zoom,
                pitch: FOCUS_VIEW.pitch,
                bearing: 0,
                speed: 1.2,
                curve: 1.4,
                essential: true
            });

            document.getElementById('card-location').innerText = obj.n;
            document.getElementById('card-type').innerText =
                Number(obj.t) === 1 ? 'Flash Flood' : 'Regular Inland Flood';
            document.getElementById('card-damage-label').innerText = 'Property Damage:';
            document.getElementById('card-damage').innerText = formatCurrency(obj.d);
            document.getElementById('card-events').innerText =
                (Number(obj.freq) || 0) + ' events in ' + YEARS[currentYear];
            document.getElementById('detail-card').style.display = 'block';
        }

        function resetView() {
            map.flyTo({
                center: DEFAULT_VIEW.center,
                zoom: DEFAULT_VIEW.zoom,
                pitch: DEFAULT_VIEW.pitch,
                bearing: DEFAULT_VIEW.bearing,
                speed: 1.0,
                curve: 1.2,
                essential: true
            });
            document.getElementById('detail-card').style.display = 'none';
        }

        // --- boot ----------------------------------------------------------

        // The deck overlay is attached straight away rather than inside
        // map.on('load'), so the columns do not depend on the basemap style
        // resolving. A rejected token or blocked style must not blank the scene.
        deckOverlay = new deck.MapboxOverlay({ layers: [] });
        map.addControl(deckOverlay);

        map.on('load', () => {
            hideMapNotice();
            map.setFog({
                'color': 'rgb(255, 255, 255)',
                'high-color': 'rgb(240, 244, 250)',
                'space-color': 'rgb(255, 255, 255)',
                'horizon-blend': 0.04
            });

            try {
                // Label denoise: the US keeps its country name, state names
                // and top hub cities; Canada/Mexico/Cuba keep only their
                // single country-level name. Counties, towns, villages, minor
                // roads, route shields, airports and POIs are silenced
                // everywhere. Each rule is defensive — layers the style lacks
                // are skipped rather than throwing.
                const layoutNone = (id) => {
                    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
                };
                const setFilterIf = (id, filter) => {
                    if (map.getLayer(id)) map.setFilter(id, filter);
                };

                layoutNone('settlement-subdivision-label');
                layoutNone('road-number-shield');
                layoutNone('airport-label');
                layoutNone('poi-label');
                layoutNone('transit-label');
                layoutNone('golf-label');
                layoutNone('water-point-label');

                setFilterIf('state-label', ['==', ['get', 'iso_3166_1'], 'US']);
                setFilterIf('settlement-label', ['all',
                    ['==', ['get', 'iso_3166_1'], 'US'],
                    ['<=', ['get', 'filterrank'], 0]
                ]);
                setFilterIf('road-label', ['in', ['get', 'class'],
                    ['literal', ['motorway', 'trunk', 'primary']]
                ]);

                // Bold slate outline along every border segment touching the US.
                map.addLayer({
                    id: 'us-border-outline',
                    type: 'line',
                    source: 'composite',
                    'source-layer': 'admin',
                    filter: ['all',
                        ['==', ['get', 'admin_level'], 0],
                        ['any',
                            ['==', ['get', 'iso_3166_1'], 'US'],
                            ['==', ['get', 'iso_3166_1_2'], 'US']
                        ]
                    ],
                    paint: {
                        'line-color': '#4a5568',
                        'line-width': 2.5
                    }
                }, 'country-label');

                // Matching coastline outline where maritime admin lines exist.
                map.addLayer({
                    id: 'us-coast-outline',
                    type: 'line',
                    source: 'composite',
                    'source-layer': 'admin',
                    filter: ['all',
                        ['==', ['get', 'admin_level'], 0],
                        ['==', ['get', 'maritime'], 'true'],
                        ['==', ['get', 'iso_3166_1'], 'US']
                    ],
                    paint: {
                        'line-color': '#4a5568',
                        'line-width': 2.5,
                        'line-opacity': 0.85
                    }
                }, 'country-label');
            } catch (e) {
                console.warn('Boundary styling unavailable:', e);
            }
        });

        map.on('error', (e) => {
            const msg = (e && e.error && e.error.message) || 'Unknown map error';
            console.warn('Basemap error:', msg);
            // 401/403 means the token is missing, expired or unauthorized.
            const tokenProblem = /401|403|not authorized|invalid token|access token/i.test(msg);
            showMapNotice(
                tokenProblem
                    ? 'Basemap unavailable: the Mapbox token is invalid or unauthorized. The data layer below still renders.'
                    : 'Basemap error: ' + msg + ' — the data layer still renders.',
                tokenProblem
            );
        });

        // 1) Render the embedded copy of the dataset immediately, so the
        //    columns exist before any network round-trip (file:// included).
        // 2) Then fetch the external JSON — the exact same path and field
        //    names as the previously working build — and swap it in when it
        //    loads cleanly. A failed fetch never blanks the scene.
        let rendered = false;
        if (EMBEDDED_TIME_SERIES) {
            rendered = applyDataset(EMBEDDED_TIME_SERIES, 'embedded copy');
        } else {
            console.warn('[flood] embedded dataset (flood_data_embedded.js) missing — waiting for fetch');
        }

        fetch('flood_timeseries_aggregated.json')
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (!isValidDataset(data)) throw new Error('Empty or malformed dataset');
                    rendered = applyDataset(data, 'flood_timeseries_aggregated.json') || rendered;
                })
                .catch(err => {
                    console.warn('[flood] external dataset unavailable:', err.message);
                    if (!rendered) {
                        setSourceLabel('DATASET UNAVAILABLE');
                        document.getElementById('hud-event-count').innerText = 'Dataset unavailable';
                        showMapNotice('Dataset unavailable: flood_timeseries_aggregated.json could not be loaded (' +
                            err.message + ').');
                    } else {
                        console.info('[flood] continuing with embedded dataset');
                    }
                });
    </script>
</body>

</html>
