<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>US Flood Disaster 3D Explorer</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
        }

        .hud-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px 20px;
            color: #1a1d21;
            z-index: 10;
            min-width: 240px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.12);
        }

        .hud-title {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 26px;
            font-weight: 700;
            color: #0a2d8c;
            font-family: monospace;
            margin: 4px 0;
        }

        .hud-sub {
            font-size: 12px;
            color: #4b5563;
        }

        #hud-source {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 10px;
            letter-spacing: 0.5px;
            color: #6b7280;
            font-family: monospace;
        }

        #map-notice {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 520px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 60, 70, 0.45);
            border-radius: 8px;
            padding: 18px 22px;
            color: #8a2b33;
            font-size: 13px;
            line-height: 1.5;
            z-index: 20;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        }

        .notice-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .notice-row input {
            flex: 1;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            padding: 7px 10px;
            color: #1a1d21;
            font-family: monospace;
            font-size: 11px;
        }

        .notice-row button {
            background: #c83c46;
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        #detail-card {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 280px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(10, 45, 140, 0.25);
            border-radius: 8px;
            padding: 20px;
            color: #1a1d21;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
            display: none;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #10131a;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .card-row span:last-child {
            color: #10131a;
            font-weight: 500;
            font-family: monospace;
        }

        .card-row.fatal span:last-child {
            color: #c83c46;
        }

        .btn-reset {
            margin-top: 12px;
            width: 100%;
            background: rgba(10, 45, 140, 0.06);
            color: #0a2d8c;
            border: 1px solid #0a2d8c;
            border-radius: 4px;
            padding: 8px 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #0a2d8c;
            color: #fff;
        }

        .timeline-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            color: #1a1d21;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.12);
        }

        .timeline-container button {
            background: #0a2d8c;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .timeline-container input[type=range] {
            width: 280px;
            accent-color: #0a2d8c;
            cursor: pointer;
        }

        .year-display {
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: #0a2d8c;
            min-width: 138px;
            text-align: right;
        }
    </style>
</head>

            2026: [

                { c: [-120.65, 35.5], d: 200000000, f: 1, n: "San Luis Obispo, CA" },
                { c: [-119.25, 34.35], d: 200000000, f: 2, n: "Ventura, CA" },
                { c: [-118.25, 34.05], d: 400000000, f: 4, n: "Los Angeles, CA" },
                { c: [-116.5, 33.75], d: 150000000, f: 2, n: "Riverside, CA" },
                { c: [-90.45, 32.3], d: 200000000, f: 2, n: "Hinds, MS" }
            ]
        };

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: DEFAULT_VIEW.center,
            zoom: DEFAULT_VIEW.zoom,
            pitch: DEFAULT_VIEW.pitch,
            bearing: DEFAULT_VIEW.bearing,
            projection: 'globe',
            maxBounds: US_BOUNDS,
            minZoom: 3.2,
            maxZoom: 12,
            dragPan: false,
            scrollZoom: false,
            boxZoom: false,
            dragRotate: false,
            keyboard: false,
            doubleClickZoom: false,
            touchZoomRotate: false
        });

        let timeSeriesData = {};
        let currentMonth = DEFAULT_MONTH;
        let isPlaying = false;
        let playInterval = null;
        let deckOverlay = null;
        let pendingLayer = null;

        // --- helpers -------------------------------------------------------

        // The basemap needs a valid Mapbox token. Override the bundled one with
        // ?token=pk... or a previously saved value; otherwise the style request
        // 401s and the basemap never loads.
        function showMapNotice(message, actionable) {
            const el = document.getElementById('map-notice');
            el.innerHTML = '';
            const text = document.createElement('div');
            text.textContent = message;
            el.appendChild(text);

            if (actionable) {
                const row = document.createElement('div');
                row.className = 'notice-row';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'pk.eyJ... Mapbox public token';
                input.id = 'token-input';
                const btn = document.createElement('button');
                btn.textContent = 'Apply';
                btn.onclick = () => {
                    const value = input.value.trim();
                    if (!value) return;
                    try { localStorage.setItem('mapbox_token', value); } catch (e) { /* private mode */ }
                    location.reload();
                };
                row.appendChild(input);
                row.appendChild(btn);
                el.appendChild(row);
            }

            el.style.display = 'block';
        }

        function hideMapNotice() {
            document.getElementById('map-notice').style.display = 'none';
        }

        function formatUSD(value) {
            const v = Number(value) || 0;
            if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
            if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
            if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
            return '$' + v;
        }

        function setSourceLabel(text) {
            document.getElementById('hud-source').innerText = 'SOURCE: ' + text;
        }

        function isValidDataset(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
            return Object.keys(data).some(y => Array.isArray(data[y]) && data[y].length > 0);
        }

        const BLUE_LOW = [180, 215, 255, 180];
        const BLUE_MID = [30, 110, 230, 210];
        const BLUE_HIGH = [10, 45, 140, 240];
        const LOG_DAMAGE_MIN = 3;
        const LOG_DAMAGE_MAX = 9;

        // Monochromatic blue ramp keyed to log10(damage): thousands of dollars
        // reads as pale ice blue, millions as true blue, 100M+ as deep navy.
        function blueForDamage(damage) {
            const d = Number(damage) || 0;
            if (d <= 0) return BLUE_LOW;
            const t = Math.min(1, Math.max(0,
                (Math.log10(d) - LOG_DAMAGE_MIN) / (LOG_DAMAGE_MAX - LOG_DAMAGE_MIN)));
            const from = t < 0.5 ? BLUE_LOW : BLUE_MID;
            const to = t < 0.5 ? BLUE_MID : BLUE_HIGH;
            const k = t < 0.5 ? t * 2 : (t - 0.5) * 2;
            return [0, 1, 2, 3].map(i => Math.round(from[i] + (to[i] - from[i]) * k));
        }

        function eventsByYear(year) {
            const rows = timeSeriesData[year] || [];
            const map = new Map();
            rows.forEach(e => {
                if (Number(e.d) > 0 && !map.has(e.n)) map.set(e.n, e);
            });
            return map;
        }

        let blendCache = {};
        let universeRows = null;

        // deck.gl tweens between frames by array index. If the row set changed
        // membership each month, a given index would silently become a different
        // county and snap to a new position mid-tween. So the layer always draws
        // a fixed, sorted universe; months where a county has no loss get zero
        // height and zero alpha, i.e. no visible column at all.
        function buildUniverse() {
            if (universeRows) return universeRows;
            const byName = new Map();
            Object.keys(timeSeriesData).map(Number).sort((a, b) => a - b).forEach(year => {
                (timeSeriesData[year] || []).forEach(e => {
                    if (!byName.has(e.n) && Array.isArray(e.c)) byName.set(e.n, e.c);
                });
            });
            universeRows = Array.from(byName.entries())
                .map(pair => ({ n: pair[0], c: pair[1] }))
                .sort((a, b) => (a.n < b.n ? -1 : a.n > b.n ? 1 : 0));
            return universeRows;
        }

        // Lerp the two neighbouring year keyframes for the current month, so the
        // columns grow and shrink continuously instead of snapping once a year.
        function blendMonth(monthIndex) {
            const clamped = Math.min(Math.max(monthIndex, 0), TOTAL_MONTHS - 1);
            if (blendCache.index === clamped) return blendCache.rows;

            // Centre each year's keyframe on mid-year (f - 0.5), so the blend is
            // continuous across year boundaries. A plain Y -> Y+1 ramp jumps at
            // New Year, because the last month still carries 1/12 of year Y.
            const f = YEAR_MIN + clamped / MONTHS_PER_YEAR;
            const k = f - 0.5;
            const seed = Math.floor(k);
            const p = k - seed;
            const yearA = Math.min(Math.max(seed, YEAR_MIN), YEAR_MAX);
            const yearB = Math.min(Math.max(seed + 1, YEAR_MIN), YEAR_MAX);

            const from = eventsByYear(yearA);
            const to = yearB === yearA ? from : eventsByYear(yearB);

            const rows = buildUniverse().map(u => {
                const a = from.get(u.n);
                const b = to.get(u.n);
                return {
                    c: u.c,
                    d: (a ? a.d : 0) * (1 - p) + (b ? b.d : 0) * p,
                    f: (a ? a.f : 0) * (1 - p) + (b ? b.f : 0) * p,
                    n: u.n
                };
            });

            blendCache = { index: clamped, rows: rows };
            return rows;
        }

        function monthLabel(monthIndex) {
            const clamped = Math.min(Math.max(monthIndex, 0), TOTAL_MONTHS - 1);
            const year = YEAR_MIN + Math.floor(clamped / MONTHS_PER_YEAR);
            const month = (clamped % MONTHS_PER_YEAR) + 1;
            return year + ' - Month ' + String(month).padStart(2, '0');
        }

        function updateLayer() {
            const rows = blendMonth(currentMonth);
            const active = rows.filter(e => Number(e.d) > 0);
            let totalLoss = 0;
            active.forEach(e => { totalLoss += Number(e.d) || 0; });

            document.getElementById('hud-total-loss').innerText = formatUSD(totalLoss);
            document.getElementById('hud-event-count').innerText =
                active.length + ' Recorded Episodes (' + monthLabel(currentMonth) + ')';
            document.getElementById('year-label').innerText = monthLabel(currentMonth);

            const columnLayer = new deck.ColumnLayer({
                id: 'flood-spikes',
                data: rows,
                getPosition: d => d.c,
                getElevation: d => Number(d.d) > 0 ? Math.log10(Number(d.d) + 1) * 35000 : 0,
                radius: 10000,
                getFillColor: d => Number(d.d) > 0 ? blueForDamage(d.d) : [0, 0, 0, 0],
                pickable: true,
                autoHighlight: true,
                highlightColor: [255, 255, 255, 255],
                transitions: {
                    getElevation: { duration: 300, easing: t => t },
                    getFillColor: { duration: 300, easing: t => t }
                },
                onClick: (info) => {
                    if (info.object && Number(info.object.d) > 0) focusOnSpike(info.object);
                }
            });

            pendingLayer = columnLayer;
            if (deckOverlay) {
                deckOverlay.setProps({ layers: [columnLayer] });
                // A broken style stops mapbox-gl's render loop, which would
                // otherwise leave the overlay frozen on its first frame.
                if (map.triggerRepaint) map.triggerRepaint();
            }
        }

        function onYearChange(val) {
            currentMonth = Math.round((parseFloat(val) - YEAR_MIN) * MONTHS_PER_YEAR);
            updateLayer();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                btn.innerText = '❚❚';
                playInterval = setInterval(() => {
                    currentMonth = currentMonth >= TOTAL_MONTHS - 1 ? 0 : currentMonth + 1;
                    document.getElementById('year-slider').value = YEAR_MIN + currentMonth / MONTHS_PER_YEAR;
                    updateLayer();
                }, PLAY_STEP_MS);
            } else {
                btn.innerText = '▶';
                clearInterval(playInterval);
            }
        }

        function focusOnSpike(obj) {
            map.flyTo({
                center: obj.c,
                zoom: FOCUS_VIEW.zoom,
                pitch: FOCUS_VIEW.pitch,
                bearing: map.getBearing() + 20,
                speed: 1.2,
                curve: 1.4,
                essential: true
            });

            document.getElementById('card-location').innerText = obj.n;
            document.getElementById('card-damage').innerText = formatUSD(obj.d);
            document.getElementById('card-deaths').innerText = obj.f;
            document.getElementById('detail-card').style.display = 'block';
        }

        function resetView() {
            map.flyTo({
                center: DEFAULT_VIEW.center,
                zoom: DEFAULT_VIEW.zoom,
                pitch: DEFAULT_VIEW.pitch,
                bearing: DEFAULT_VIEW.bearing,
                speed: 1.0,
                curve: 1.2,
                essential: true
            });
            document.getElementById('detail-card').style.display = 'none';
        }

        // --- boot ----------------------------------------------------------

        // The deck overlay is attached straight away rather than inside
        // map.on('load'), so the columns do not depend on the basemap style
        // resolving. A rejected token or blocked style must not blank the scene.
        deckOverlay = new deck.MapboxOverlay({ layers: [] });
        map.addControl(deckOverlay);

        map.on('load', () => {
            hideMapNotice();
            map.setFog({
                'color': 'rgb(255, 255, 255)',
                'high-color': 'rgb(235, 240, 248)',
                'space-color': 'rgb(255, 255, 255)',
                'horizon-blend': 0.05
            });
        });

        map.on('error', (e) => {
            const msg = (e && e.error && e.error.message) || 'Unknown map error';
            console.warn('Basemap error:', msg);
            // 401/403 means the token is missing, expired or unauthorized.
            const tokenProblem = /401|403|not authorized|invalid token|access token/i.test(msg);
            showMapNotice(
                tokenProblem
                    ? 'Basemap unavailable: the Mapbox token is invalid or unauthorized. The data layer below still renders.'
                    : 'Basemap error: ' + msg + ' — the data layer still renders.',
                tokenProblem
            );
        });

        // Render the built-in dataset immediately so the globe is never empty,
        // then swap in the external file if it loads cleanly.
        timeSeriesData = fallbackData;
        setSourceLabel('BUILT-IN (2001-2026)');
        updateLayer();

        fetch('flood_timeseries_1996_2026.json')
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (!isValidDataset(data)) throw new Error('Empty or malformed dataset');
                    // Merge over the built-in set so any year the external file
                    // omits (e.g. 2002) still renders instead of going blank.
                    timeSeriesData = Object.assign({}, fallbackData, data);
                    universeRows = null;
                    blendCache = {};
                    setSourceLabel('EXTERNAL DATASET');
                    updateLayer();
                })
                .catch(err => {
                    // Network error, CORS block (file://), 404 or empty payload:
                    // stay on the built-in dataset so the map keeps rendering.
                    console.warn('External flood dataset unavailable, using built-in data:', err.message);
                    setSourceLabel('BUILT-IN FALLBACK (2001-2026)');
                });
    </script>
